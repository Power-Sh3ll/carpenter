[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carpenter"
version = "0.1.0"
description = "A Python job registry built on top of threading and subprocesses."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Power-Sh3ll" }]
keywords = ["jobs", "subprocess", "threading", "registry", "supervisor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Power-Sh3ll/carpenter"
Repository = "https://github.com/Power-Sh3ll/carpenter.git"
Issues = "https://github.com/Power-Sh3ll/carpenter/issues"

[tool.setuptools]
packages = ["carpenter"]
